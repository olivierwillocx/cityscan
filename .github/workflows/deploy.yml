name: Deploy to OVH (SFTP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ovh-sftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp >/dev/null

      - name: Deploiement SFTP vers OVH (/home/citysca/www)
        env:
          SRV: ${{ secrets.OVH_FTP_SERVER }}
          USR: ${{ secrets.OVH_FTP_USERNAME }}
          PWD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          lftp -c "
          set sftp:auto-confirm yes;
          set net:max-retries 2;
          set net:timeout 25;
          open -u \"$USR\",\"$PWD\" sftp://$SRV:22;
          mirror -R --delete --verbose --parallel=4 \
            --exclude-glob .git* \
            --exclude .github/ \
            --exclude README.md \
            --exclude MISE-A-JOUR.md \
            ./ /home/citysca/www/;
          "
