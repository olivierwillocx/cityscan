name: Deploy to OVH (FTP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ovh-ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assurer la mention editeur responsable
        run: python3 .github/ensure_editeur.py

      - name: Deploiement FTP vers OVH (dossier www)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: www/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            MISE-A-JOUR.md
