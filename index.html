<title>CityScan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --surface2:#EBEEF6; --ink:#171E33; --muted:#5B6480; --line:#D9DDE8;
  --accent:#2247C9; --accent-ink:#FFFFFF; --accent-soft:#E4EAFB;
  --best:#1B7F5C; --best-soft:#DFF3EA; --bad:#B8322A; --bad-soft:#F9E3E0; --watch:#A86E0C; --watch-soft:#FBEFD6;
  --shadow:0 1px 2px rgba(23,30,51,.06),0 8px 24px -12px rgba(23,30,51,.18);
  --display:"Fraunces",Georgia,"Times New Roman",serif; --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#161B2D; --surface2:#1F2540; --ink:#E8EBF4; --muted:#A3ABC4; --line:#2B3352;
  --accent:#7B98FF; --accent-ink:#0E1220; --accent-soft:#1F2A55;
  --best:#5BC79A; --best-soft:#123A2C; --bad:#F08A80; --bad-soft:#48201C; --watch:#F0B85A; --watch-soft:#3E2E0F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#161B2D; --surface2:#1F2540; --ink:#E8EBF4; --muted:#A3ABC4; --line:#2B3352;
  --accent:#7B98FF; --accent-ink:#0E1220; --accent-soft:#1F2A55;
  --best:#5BC79A; --best-soft:#123A2C; --bad:#F08A80; --bad-soft:#48201C; --watch:#F0B85A; --watch-soft:#3E2E0F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex:1 1 auto;min-width:0}
.mark{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.mark .wm{font-style:normal}.mark b{color:var(--accent);font-weight:inherit}
.mark svg{width:28px;height:28px;flex:none}
.who{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{padding:5px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--bg);min-width:190px;flex:0 1 300px}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;width:100%;outline:none}
.search input::placeholder{color:var(--muted)}

.wrap{max-width:1240px;margin:0 auto;padding-block:24px 64px;padding-inline:20px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:34px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:18px}}
.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 96px);overflow-y:auto;padding-right:4px}
@media (max-width:900px){.side{position:static;max-height:none;overflow:visible}}
.menu h4{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.menu ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
@media (max-width:900px){.menu ul{flex-direction:row;flex-wrap:wrap;gap:6px}}
.menu li button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:6px 10px;border-radius:8px;color:var(--ink);font-size:15px}
.menu li button:hover{background:var(--surface2)}
.menu li button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
@media (max-width:900px){.menu li button{width:auto;border:1px solid var(--line);background:var(--surface);padding:5px 10px;font-size:14px}}
.menu .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.menu li button[aria-current="true"] .n{color:inherit}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;margin-right:7px}
.dot.best{background:var(--best)}.dot.bad{background:var(--bad)}.dot.watch{background:var(--watch)}

.thesis{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}
.thesis h1{font-size:clamp(26px,3.5vw,40px);font-weight:500;letter-spacing:-.01em;max-width:22ch}
.thesis h1 em{font-style:italic;color:var(--accent)}
.thesis p{max-width:70ch;margin:14px 0 0;color:var(--muted);font-size:17px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:14px}
.legend span{display:inline-flex;align-items:center}

.figs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:16px}
@media (max-width:820px){.figs{grid-template-columns:repeat(2,1fr)}}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left}
.fig b{font-family:var(--display);font-size:28px;font-weight:700;display:block;line-height:1;font-variant-numeric:tabular-nums}
.fig small{color:var(--muted);font-size:13px;display:block;margin-top:2px}
button.fig:hover{border-color:var(--accent)}
.fig.best b{color:var(--best)}.fig.bad b{color:var(--bad)}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 12px}
.sec h2{font-size:23px;font-weight:600}
.sec .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lead{background:var(--surface2);border-left:3px solid var(--accent);padding:14px 18px;border-radius:0 10px 10px 0;max-width:80ch}
.lead p{margin:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:9px}
.tile:hover{border-color:var(--accent)}
.tile .h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tile .h b{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.2}
.tile .h span{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.vbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface2)}
.vbar i{display:block}
.vbar i.best{background:var(--best)}.vbar i.bad{background:var(--bad)}.vbar i.watch{background:var(--watch)}
.tile .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .sub b{font-weight:600}
.tile .sub .cb{color:var(--best)}.tile .sub .cd{color:var(--bad)}.tile .sub .cw{color:var(--watch)}

.prose{max-width:72ch}
.prose p{margin:0 0 16px;font-size:17px;line-height:1.62}
.prose p.sig{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:17px;line-height:1.5}
.legal{display:grid;gap:14px;max-width:80ch}
.legal section{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:16px 18px}
.legal h3{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.legal p{margin:0;font-size:15.5px;line-height:1.6}
.todo{background:var(--watch-soft);color:var(--watch);border:1px dashed var(--watch);border-radius:5px;padding:1px 7px;font-family:var(--mono);font-size:12.5px;font-weight:500}
.cta{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:11px 20px;border-radius:9px}
.cta:hover{filter:brightness(1.08)}
.fine{color:var(--muted);font-size:13.5px;line-height:1.55;max-width:74ch}
.note{background:var(--watch-soft);color:var(--watch);border:1px solid var(--watch);border-radius:9px;padding:10px 14px;font-size:14px;margin-bottom:14px;max-width:80ch}
.footnav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}
.footnav button{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:0}
.yearnav{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 16px}
.yearnav button{font-family:var(--mono);font-size:12px;letter-spacing:.04em;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.yearnav button:hover{border-color:var(--accent);color:var(--accent)}
.yearnav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.group h3{font-size:13.5px;font-family:var(--mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card.best{border-left:4px solid var(--best)}.card.bad{border-left:4px solid var(--bad)}.card.watch{border-left:4px solid var(--watch)}
.card summary{list-style:none;cursor:pointer;padding:15px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 14px;align-items:start}
.card summary::-webkit-details-marker{display:none}
.card summary:hover{background:var(--surface2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;grid-column:1/-1}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--bg)}
.chip.inst{border-color:transparent;background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.v{border-color:transparent;font-weight:500}
.chip.v.best{background:var(--best-soft);color:var(--best)}.chip.v.bad{background:var(--bad-soft);color:var(--bad)}.chip.v.watch{background:var(--watch-soft);color:var(--watch)}
.card .t{font-family:var(--display);font-weight:600;font-size:18.5px;line-height:1.28;text-wrap:balance}
.card .c{color:var(--muted);font-size:14px}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.bars{display:flex;gap:3px}.bars i{width:14px;height:6px;border-radius:2px;background:var(--line)}.bars i.on{background:var(--accent)}
.card summary .open{font-family:var(--mono);font-size:11px;color:var(--accent);grid-column:1/-1;letter-spacing:.06em;text-transform:uppercase}
.card[open] summary .open{display:none}
.body{padding:4px 18px 20px;border-top:1px dashed var(--line);display:grid;grid-template-columns:152px minmax(0,1fr);gap:11px 18px;font-size:15.5px}
@media (max-width:660px){.body{grid-template-columns:1fr;gap:3px 0}.body dt{margin-top:11px}}
.body dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.body dd{margin:0;max-width:74ch}
.body dd.angle{background:var(--accent-soft);padding:10px 14px;border-radius:8px;font-weight:600}
.body ul{margin:0;padding-left:18px}.body li{margin:2px 0;word-break:break-word}
.body .src{font-size:14px}

.plain{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 22px;margin:0;list-style:none}
.plain li{padding:9px 0;border-bottom:1px solid var(--line)}.plain li:last-child{border:0}
.rowlist{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.row b{font-family:var(--display);font-size:17px;font-weight:600}
.row .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.foot{max-width:1240px;margin:0 auto;padding:18px 20px 44px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.foot p{margin:4px 0;max-width:90ch}
@media (prefers-reduced-motion:no-preference){.card summary,.tile,.row{transition:background .15s,border-color .15s}}
</style>

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const tr=function(o){if(o==null)return "";if(typeof o==="string")return o;if(o[lang]!=null)return o[lang];if(o.fr!=null)return o.fr;if(o.nl!=null)return o.nl;return o.en!=null?o.en:"";};
const VT=function(){return (window.LABMR&&window.LABMR.villesTrad)||{};};
const vk=function(c){const e=VT()[c];return (e&&e[lang])||c;};
const txt=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="todo">$1</span>');
const PG=()=>(window.LABMR&&window.LABMR.pages)||{};
let lang="fr", route={view:"home",key:null}, q="";
const t=()=>T[lang];
const MATS=(function(){const m=new Map();F.forEach(f=>{if(!m.has(f.matiere.key))m.set(f.matiere.key,f.matiere)});return [...m.values()].sort((a,b)=>cnt(b.key)-cnt(a.key))})();
function cnt(k){return F.filter(f=>f.matiere.key===k).length}
function vcount(list){return {best:list.filter(f=>f.verdict==="best").length,bad:list.filter(f=>f.verdict==="bad").length,watch:list.filter(f=>f.verdict==="watch").length}}

function parseHash(){
  const h=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  if(h[0]==="nl"||h[0]==="fr"||h[0]==="en")lang=h.shift();
  route={view:h[0]||"home",key:h[1]?decodeURIComponent(h[1]):null};
}
function go(view,key){location.hash="#/"+lang+"/"+(view||"home")+(key?"/"+encodeURIComponent(key):"");}
function setLang(l){lang=l;go(route.view,route.key);}
function matches(f){
  if(!q)return true;const s=q.toLowerCase();
  return [tr(f.titre),tr(f.ville),tr(f.theme),tr(f.quoi),tr(f.matiere),f.villeKey,vk(f.villeKey),f.inst,tr(f.competence),tr(f.transposabilite)].join(" ").toLowerCase().includes(s);
}
function bars(tr){const n={forte:3,moyenne:2,faible:1}[tr]||0;return '<span class="bars">'+[1,2,3].map(i=>'<i class="'+(i<=n?"on":"")+'"></i>').join("")+'</span>';}
function vbar(list){const c=vcount(list),n=list.length||1;return '<span class="vbar"><i class="best" style="width:'+(c.best/n*100)+'%"></i><i class="bad" style="width:'+(c.bad/n*100)+'%"></i><i class="watch" style="width:'+(c.watch/n*100)+'%"></i></span>';}
function fmtMonth(iso){const L=t(),[y,m]=iso.split("-");return L.months[+m-1]+" "+y;}

function nbMois(){
  const d=F.map(f=>f.dateISO).sort(), a=d[0].split("-"), b=d[d.length-1].split("-");
  return (b[0]-a[0])*12+(b[1]-a[1])+1;
}
function annees(){return [...new Set(F.map(f=>f.dateISO.slice(0,4)))].sort().reverse()}
function card(f){
  const L=t();
  return '<details class="card '+f.verdict+'" id="'+f.id+'">'
  +'<summary><div class="chips">'

  +'</dl></details>';
}
function grouped(list,keyFn,labelFn){
  const g=new Map();list.forEach(f=>{const k=keyFn(f);if(!g.has(k))g.set(k,[]);g.get(k).push(f)});
  return [...g.entries()].map(([k,fs])=>'<section class="group"><h3><span>'+esc(labelFn(k))+'</span><span>'+fs.length+'</span></h3><div class="cards">'+fs.map(card).join("")+'</div></section>').join("");
}

  document.querySelectorAll("#side button").forEach(b=>b.addEventListener("click",()=>{q="";document.getElementById("q").value="";go(b.dataset.v,b.dataset.k||null)}));

      tl:[["2024 –","Député bruxellois (MR)"],["depuis ~2006","Enseignant, aujourd'hui à l'EPFC"],["2000 – 2024","Directeur général puis administrateur délégué de BECI"],["21 ans","Vice-président de la plus grande école de promotion sociale de Bruxelles"],["8 ans","Comité de gestion de Bruxelles Formation"],["2012 – 2015","Président du Conseil économique et social bruxellois"],["2014 – 2021","Conseiller social à la Cour du travail de Bruxelles"],["1995 – 1997","Conseiller au cabinet d'un ministre bruxellois"]],
      c:"Contact"},
     nl:{h:"Olivier Willocx",sub:"Volksvertegenwoordiger in het Brussels Hoofdstedelijk Parlement (MR) · Leerkracht",
      p:["Olivier Willocx, geboren in Brussel in 1966, is sinds de verkiezingen van 9 juni 2024 Brussels volksvertegenwoordiger voor de MR. Hij is ook gemeenteraadslid in Schaarbeek.",
         "Hij geeft al bijna twintig jaar les, vandaag aan het EPFC, waar hij onder meer het businessplan doceert. Hij was eenentwintig jaar ondervoorzitter van de grootste school voor sociale promotie in Brussel en acht jaar lid van het beheerscomité van Bruxelles Formation — dus midden in een van de bevoegdheden die deze site doorlicht.",

         "Hij is econoom (ULB) en behaalde een master Europees recht aan de Universiteit van Amsterdam. Hij was adviseur op het kabinet van een Brussels minister en economisch attaché van het Gewest bij de Europese Unie.",
         "CityScan bouwt daarop voort: kijken wat andere Europese steden echt gedaan hebben, meten wat werkte en wat mislukte, en daaruit concrete voorstellen voor Brussel halen."],
      k:"Loopbaan",
      tl:[["2024 –","Brussels volksvertegenwoordiger (MR)"],["sinds ~2006","Leerkracht, vandaag aan het EPFC"],["2000 – 2024","Directeur-generaal en daarna gedelegeerd bestuurder van BECI"],["21 jaar","Ondervoorzitter van de grootste school voor sociale promotie in Brussel"],["8 jaar","Beheerscomité van Bruxelles Formation"],["2012 – 2015","Voorzitter van de Brusselse Economische en Sociale Raad"],["2014 – 2021","Raadsheer in sociale zaken, Arbeidshof Brussel"],["1995 – 1997","Adviseur op het kabinet van een Brussels minister"]],
      c:"Contact"},
     en:{h:"Olivier Willocx",sub:"Member of the Parliament of the Brussels-Capital Region (MR) · Teacher",
      p:["Olivier Willocx, born in Brussels in 1966, has been a Member of the Brussels Parliament for the MR since the elections of 9 June 2024. He is also a municipal councillor in Schaerbeek.",
         "He has been teaching for close to twenty years, today at the EPFC, where he teaches the business plan among other subjects. For twenty-one years he was vice-president of the largest adult education college in Brussels, and for eight years a member of the management committee of Bruxelles Formation — that is, at the heart of one of the competences this site reviews.",
         "Before entering Parliament he spent close to a quarter of a century at the head of BECI, the Brussels Chamber of Commerce and Union of Enterprises (2000-2024), as director general and then chief executive. He chaired the Economic and Social Council of the Brussels-Capital Region (2012-2015) and sat as a lay judge and then lay counsellor at the Brussels Labour Court.",

      c:"Contact"}}[lang];
    html='<section class="thesis"><div class="eyebrow">CityScan</div><h1>'+A.h+'</h1><p style="margin-top:6px;font-weight:600;color:var(--ink)">'+A.sub+'</p>'
     +A.p.map(x=>'<p>'+esc(x)+'</p>').join("")+'</section>'
     +head(A.k)+'<ul class="plain">'+A.tl.map(r=>'<li style="display:grid;grid-template-columns:130px 1fr;gap:12px"><span class="eyebrow" style="padding-top:3px;font-variant-numeric:tabular-nums">'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></li>').join("")+'</ul>'

  if(lang==="en"&&L.noEn&&/^(all|chrono|verdict|matiere|inst|city|edition)$/.test(route.view)&&F.some(function(f){return f.titre.en==null}))
    html='<div class="note">'+esc(L.noEn)+'</div>'+html;
  const m=document.getElementById("main");m.innerHTML=html;
  m.querySelectorAll("[data-v]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.v,b.dataset.k||null)));

function render(){
  const L=t();document.documentElement.lang=lang;
  document.getElementById("who").textContent=L.who;document.getElementById("who").href="#/"+lang+"/auteur";
  document.getElementById("q").placeholder=L.search;
  document.getElementById("lfr").setAttribute("aria-pressed",lang==="fr");
  document.getElementById("lnl").setAttribute("aria-pressed",lang==="nl");
  document.getElementById("len").setAttribute("aria-pressed",lang==="en");
  const foot=document.getElementById("foot");
  const V=(window.LABMR&&window.LABMR.version)||null;
  foot.innerHTML='<p>'+L.foot1+'</p><p>'+L.foot2+' © '+esc(D.auteur)+'.</p>'
   +(V?'<p class="fine">'+L.ver+' '+esc(V.num)+' — '+esc(tr(V.date))+'</p>':'')
   +'<p class="footnav"><button data-v="pourquoi">'+L.why+'</button><button data-v="reco">'+L.recoShort+'</button><button data-v="mentions">'+L.legalShort+'</button></p>';
  foot.querySelectorAll("[data-v]").forEach(function(b){b.addEventListener("click",function(){go(b.dataset.v)})});
  renderSide();renderMain();window.scrollTo({top:0});
}
document.getElementById("lfr").addEventListener("click",()=>setLang("fr"));
document.getElementById("lnl").addEventListener("click",()=>setLang("nl"));
document.getElementById("len").addEventListener("click",()=>setLang("en"));
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim();renderMain()});
window.addEventListener("hashchange",()=>{parseHash();render()});
parseHash();render();
})();
