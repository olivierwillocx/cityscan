<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CityScan</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --surface2:#EBEEF6; --ink:#171E33; --muted:#5B6480; --line:#D9DDE8;
  --accent:#2247C9; --accent-ink:#FFFFFF; --accent-soft:#E4EAFB;
  --best:#1B7F5C; --best-soft:#DFF3EA; --bad:#B8322A; --bad-soft:#F9E3E0; --watch:#A86E0C; --watch-soft:#FBEFD6;
  --shadow:0 1px 2px rgba(23,30,51,.06),0 8px 24px -12px rgba(23,30,51,.18);
  --display:"Fraunces",Georgia,"Times New Roman",serif; --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#161B2D; --surface2:#1F2540; --ink:#E8EBF4; --muted:#A3ABC4; --line:#2B3352;
  --accent:#7B98FF; --accent-ink:#0E1220; --accent-soft:#1F2A55;
  --best:#5BC79A; --best-soft:#123A2C; --bad:#F08A80; --bad-soft:#48201C; --watch:#F0B85A; --watch-soft:#3E2E0F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#161B2D; --surface2:#1F2540; --ink:#E8EBF4; --muted:#A3ABC4; --line:#2B3352;
  --accent:#7B98FF; --accent-ink:#0E1220; --accent-soft:#1F2A55;
  --best:#5BC79A; --best-soft:#123A2C; --bad:#F08A80; --bad-soft:#48201C; --watch:#F0B85A; --watch-soft:#3E2E0F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex:1 1 auto;min-width:0}
.mark{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.mark .wm{font-style:normal}.mark b{color:var(--accent);font-weight:inherit}
.mark svg{width:28px;height:28px;flex:none}
.who{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{padding:5px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--bg);min-width:190px;flex:0 1 300px}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;width:100%;outline:none}
.search input::placeholder{color:var(--muted)}

.wrap{max-width:1240px;margin:0 auto;padding-block:24px 64px;padding-inline:20px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:34px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:18px}}
.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 96px);overflow-y:auto;padding-right:4px}
@media (max-width:900px){.side{position:static;max-height:none;overflow:visible}}
.menu h4{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.menu ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
@media (max-width:900px){.menu ul{flex-direction:row;flex-wrap:wrap;gap:6px}}
.menu li button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:6px 10px;border-radius:8px;color:var(--ink);font-size:15px}
.menu li button:hover{background:var(--surface2)}
.menu li button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
@media (max-width:900px){.menu li button{width:auto;border:1px solid var(--line);background:var(--surface);padding:5px 10px;font-size:14px}}
.menu .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.menu li button[aria-current="true"] .n{color:inherit}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;margin-right:7px}
.dot.best{background:var(--best)}.dot.bad{background:var(--bad)}.dot.watch{background:var(--watch)}

.thesis{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}
.thesis h1{font-size:clamp(26px,3.5vw,40px);font-weight:500;letter-spacing:-.01em;max-width:22ch}
.thesis h1 em{font-style:italic;color:var(--accent)}
.thesis p{max-width:70ch;margin:14px 0 0;color:var(--muted);font-size:17px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:14px}
.legend span{display:inline-flex;align-items:center}

.figs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:16px}
@media (max-width:820px){.figs{grid-template-columns:repeat(2,1fr)}}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left}
.fig b{font-family:var(--display);font-size:28px;font-weight:700;display:block;line-height:1;font-variant-numeric:tabular-nums}
.fig small{color:var(--muted);font-size:13px;display:block;margin-top:2px}
button.fig:hover{border-color:var(--accent)}
.fig.best b{color:var(--best)}.fig.bad b{color:var(--bad)}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 12px}
.sec h2{font-size:23px;font-weight:600}
.sec .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lead{background:var(--surface2);border-left:3px solid var(--accent);padding:14px 18px;border-radius:0 10px 10px 0;max-width:80ch}
.lead p{margin:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:9px}
.tile:hover{border-color:var(--accent)}
.tile .h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tile .h b{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.2}
.tile .h span{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.vbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface2)}
.vbar i{display:block}
.vbar i.best{background:var(--best)}.vbar i.bad{background:var(--bad)}.vbar i.watch{background:var(--watch)}
.tile .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .sub b{font-weight:600}
.tile .sub .cb{color:var(--best)}.tile .sub .cd{color:var(--bad)}.tile .sub .cw{color:var(--watch)}

.prose{max-width:72ch}
.prose p{margin:0 0 16px;font-size:17px;line-height:1.62}
.prose p.sig{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:17px;line-height:1.5}
.legal{display:grid;gap:14px;max-width:80ch}
.legal section{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:16px 18px}
.legal h3{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.legal p{margin:0;font-size:15.5px;line-height:1.6}
.todo{background:var(--watch-soft);color:var(--watch);border:1px dashed var(--watch);border-radius:5px;padding:1px 7px;font-family:var(--mono);font-size:12.5px;font-weight:500}
.cta{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:11px 20px;border-radius:9px}
.cta:hover{filter:brightness(1.08)}
.fine{color:var(--muted);font-size:13.5px;line-height:1.55;max-width:74ch}
.note{background:var(--watch-soft);color:var(--watch);border:1px solid var(--watch);border-radius:9px;padding:10px 14px;font-size:14px;margin-bottom:14px;max-width:80ch}
.footnav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}
.footnav button{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:0}
.yearnav{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 16px}
.yearnav button{font-family:var(--mono);font-size:12px;letter-spacing:.04em;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.yearnav button:hover{border-color:var(--accent);color:var(--accent)}
.yearnav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.group h3{font-size:13.5px;font-family:var(--mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card.best{border-left:4px solid var(--best)}.card.bad{border-left:4px solid var(--bad)}.card.watch{border-left:4px solid var(--watch)}
.card summary{list-style:none;cursor:pointer;padding:15px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 14px;align-items:start}
.card summary::-webkit-details-marker{display:none}
.card summary:hover{background:var(--surface2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;grid-column:1/-1}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--bg)}
.chip.inst{border-color:transparent;background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.v{border-color:transparent;font-weight:500}
.chip.v.best{background:var(--best-soft);color:var(--best)}.chip.v.bad{background:var(--bad-soft);color:var(--bad)}.chip.v.watch{background:var(--watch-soft);color:var(--watch)}
.card .t{font-family:var(--display);font-weight:600;font-size:18.5px;line-height:1.28;text-wrap:balance}
.card .c{color:var(--muted);font-size:14px}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.bars{display:flex;gap:3px}.bars i{width:14px;height:6px;border-radius:2px;background:var(--line)}.bars i.on{background:var(--accent)}
.card summary .open{font-family:var(--mono);font-size:11px;color:var(--accent);grid-column:1/-1;letter-spacing:.06em;text-transform:uppercase}
.card[open] summary .open{display:none}
.body{padding:4px 18px 20px;border-top:1px dashed var(--line);display:grid;grid-template-columns:152px minmax(0,1fr);gap:11px 18px;font-size:15.5px}
@media (max-width:660px){.body{grid-template-columns:1fr;gap:3px 0}.body dt{margin-top:11px}}
.body dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.body dd{margin:0;max-width:74ch}
.body dd.angle{background:var(--accent-soft);padding:10px 14px;border-radius:8px;font-weight:600}
.body ul{margin:0;padding-left:18px}.body li{margin:2px 0;word-break:break-word}
.body .src{font-size:14px}

.plain{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 22px;margin:0;list-style:none}
.plain li{padding:9px 0;border-bottom:1px solid var(--line)}.plain li:last-child{border:0}
.rowlist{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.row b{font-family:var(--display);font-size:17px;font-weight:600}
.row .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.foot{max-width:1240px;margin:0 auto;padding:18px 20px 44px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.foot p{margin:4px 0;max-width:90ch}
@media (prefers-reduced-motion:no-preference){.card summary,.tile,.row{transition:background .15s,border-color .15s}}
.aibar{background:var(--watch-soft);border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.aibar-in{max-width:1240px;margin:0 auto;padding:7px 20px;display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
.aibar b{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--watch);white-space:nowrap}
.aibar span{flex:1 1 320px;min-width:0}
.aibar button{color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:13.5px;white-space:nowrap}
.filters{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.frow{display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px 12px;align-items:start}
@media (max-width:660px){.frow{grid-template-columns:1fr}}
.frow>span{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.fchips button{font-size:13.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:left}
.fchips button:hover{border-color:var(--accent)}
.fchips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.fchips button .k{opacity:.7;font-family:var(--mono);font-size:11px;margin-left:5px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 16px}
.btn{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13.5px;background:var(--bg);color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.warn:hover{border-color:var(--bad);color:var(--bad)}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.main:hover{color:var(--accent-ink);filter:brightness(1.08)}
.form{display:grid;gap:14px;max-width:80ch;margin-top:16px}
.form label{display:grid;gap:5px;font-size:14px;font-weight:600}
.form label small{font-weight:400;color:var(--muted)}
.form input,.form textarea,.form select{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.form textarea{min-height:110px;resize:vertical}
.out{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;max-width:80ch;margin-top:18px}
.out h3{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.out pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:13px;line-height:1.5;max-height:300px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.out .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addr{font-family:var(--mono);font-size:14px;user-select:all;word-break:break-all}
.status{font-size:14px;color:var(--best);min-height:1.3em}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.checks label{display:flex;grid-template-columns:none;gap:8px;align-items:center;font-weight:400;font-size:15px}
.checks input{width:auto;accent-color:var(--accent)}
.form fieldset{border:0;padding:0;margin:0;display:grid;gap:6px;min-width:0}
.form legend{font-size:14px;font-weight:600;padding:0;margin-bottom:6px}
</style>

<script>
(function(){
const D=(function(){
  const L=window.LABMR;
  if(!L||!L.fiches||!L.fiches.length) return window.LABMR_DATA;   // repli sur l ancien fichier unique
  const M_FR=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const M_NL=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
  const M_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const lbl=(iso,m)=>{const p=iso.split("-");return (+p[2])+" "+m[+p[1]-1]+" "+p[0];};
  const EP=L.enPatch||{};
  L.fiches.forEach(function(f){ const e=EP[f.id]; if(!e) return;
    for(const k in e){ if(f[k]&&typeof f[k]==="object"&&f[k].en==null) f[k].en=e[k]; } });

  const h=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  if(h[0]==="nl"||h[0]==="fr"||h[0]==="en")lang=h.shift();
  route={view:h[0]||"home",key:h[1]?decodeURIComponent(h[1]):null};
}
function go(view,key){location.hash="#/"+lang+"/"+(view||"home")+(key?"/"+encodeURIComponent(key):"");}
function setLang(l){lang=l;go(route.view,route.key);}
function matches(f){
  if(!q)return true;const s=q.toLowerCase();
  return [tr(f.titre),tr(f.ville),tr(f.theme),tr(f.quoi),tr(f.matiere),f.villeKey,vk(f.villeKey),f.inst,tr(f.competence),tr(f.transposabilite)].join(" ").toLowerCase().includes(s);
}
function bars(tr){const n={forte:3,moyenne:2,faible:1}[tr]||0;return '<span class="bars">'+[1,2,3].map(i=>'<i class="'+(i<=n?"on":"")+'"></i>').join("")+'</span>';}
function vbar(list){const c=vcount(list),n=list.length||1;return '<span class="vbar"><i class="best" style="width:'+(c.best/n*100)+'%"></i><i class="bad" style="width:'+(c.bad/n*100)+'%"></i><i class="watch" style="width:'+(c.watch/n*100)+'%"></i></span>';}
function fmtMonth(iso){const L=t(),[y,m]=iso.split("-");return L.months[+m-1]+" "+y;}

function nbMois(){
  const d=F.map(f=>f.dateISO).sort(), a=d[0].split("-"), b=d[d.length-1].split("-");
  return (b[0]-a[0])*12+(b[1]-a[1])+1;
}
function annees(){return [...new Set(F.map(f=>f.dateISO.slice(0,4)))].sort().reverse()}
function card(f){
  const L=t();
  return '<details class="card '+f.verdict+'" id="'+f.id+'">'
  +'<summary><div class="chips">'
  +'<span class="chip v '+f.verdict+'">'+L.verdictName[f.verdict]+'</span>'
  +'<span class="chip inst">'+esc(L.instName[f.inst]||f.inst)+'</span>'
  +'<span class="chip">'+esc(tr(f.theme))+'</span>'
  +'<span class="chip">'+esc(vk(f.villeKey))+' · '+esc(f.pays)+'</span>'
  +'<span class="chip">'+esc(fmtMonth(f.dateISO))+'</span></div>'
  +'<div><div class="t">'+esc(tr(f.titre))+'</div><div class="c">'+esc(tr(f.date))+'</div></div>'
  +'<div class="tr">'+L.transpoL+' · '+L.transpo[f.transpo]+bars(f.transpo)+'</div>'
  +'<span class="open">'+L.open+'</span></summary>'
  +'<dl class="body">'
  +'<dt>'+L.fVille+'</dt><dd>'+esc(tr(f.ville))+'</dd>'
  +'<dt>'+L.fComp+'</dt><dd>'+esc(tr(f.competence))+'</dd>'
  +'<dt>'+L.fQuoi+'</dt><dd>'+esc(tr(f.quoi))+'</dd>'
  +'<dt>'+L.fRes+'</dt><dd>'+esc(tr(f.resultats))+'</dd>'
  +'<dt>'+L.fTrans+'</dt><dd>'+esc(tr(f.transposabilite))+'</dd>'
  +'<dt>'+L.fAngle+'</dt><dd class="angle">'+esc(tr(f.angle))+'</dd>'
  +'<dt>'+L.fSrc+'</dt><dd class="src"><ul>'+f.sources.map(s=>'<li>'+esc(s.media)+', '+esc(s.date)+' — <a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.url.replace(/^https?:\/\/(www\.)?/,"").slice(0,64))+(s.url.length>72?"…":"")+'</a></li>').join("")+'</ul></dd>'
  +'</dl><div class="acts"><button class="btn warn" data-v="contribuer" data-k="c:'+esc(f.id)+'">'+L.cContest+'</button><button class="btn" data-v="contribuer" data-k="k:'+esc(f.id)+'">'+L.cFix+'</button></div></details>';
}
function grouped(list,keyFn,labelFn){
  const g=new Map();list.forEach(f=>{const k=keyFn(f);if(!g.has(k))g.set(k,[]);g.get(k).push(f)});
  return [...g.entries()].map(([k,fs])=>'<section class="group"><h3><span>'+esc(labelFn(k))+'</span><span>'+fs.length+'</span></h3><div class="cards">'+fs.map(card).join("")+'</div></section>').join("");
}
function head(title,meta){return '<div class="sec"><h2>'+title+'</h2>'+(meta?'<span class="meta">'+esc(meta)+'</span>':"")+'</div>';}

  const cities=[...new Set(F.map(f=>f.villeKey))].map(c=>[c,F.filter(f=>f.villeKey===c).length]).sort((a,b)=>b[1]-a[1]||vk(a[0]).localeCompare(vk(b[0])));

   +item("verdict","watch",L.watch,F.filter(f=>f.verdict==="watch").length,"watch")+'</ul></nav>'
   +'<nav class="menu"><h4>'+L.mMat+'</h4><ul>'+MATS.map(m=>item("matiere",m.key,tr(m),cnt(m.key))).join("")+'</ul></nav>'
   +'<nav class="menu"><h4>'+L.mInst+'</h4><ul>'+["Région","COCOM","COCOF"].map(i=>item("inst",i,L.instName[i],F.filter(f=>f.inst.indexOf(i)>=0).length)).join("")+'</ul></nav>'

  if(lang==="en"&&L.noEn&&/^(all|chrono|verdict|matiere|inst|city|edition|explorer)$/.test(route.view)&&F.some(function(f){return f.titre.en==null}))
    html='<div class="note">'+esc(L.noEn)+'</div>'+html;
  const m=document.getElementById("main");m.innerHTML=html;
  m.querySelectorAll("[data-v]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.v,b.dataset.k||null)));
  m.querySelectorAll("[data-exk]").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.exk==="reset"){ex={mat:null,verdict:null,inst:null};if(route.key){go("explorer",null);return;}}
    else ex[b.dataset.exk]=b.dataset.exv||null;
    renderMain();}));
  if(m.querySelector("#cf")) wireContrib(m);
  if(m.querySelector("#nf")) wireNews(m);
}
const NLADDR=()=>(window.LABMR&&(window.LABMR.newsletterContact||window.LABMR.contact))||"";
function viewNews(){
  const L=t(), N=PG().newsletter||{}, un=route.key==="u", A=NLADDR();
  if(!draft.nlThemes) draft.nlThemes={};
  if(!draft.nlLang) draft.nlLang=lang.toUpperCase();
  const mode=(k,label)=>'<button data-v="newsletter" data-k="'+k+'" aria-pressed="'+((k==="u")===un)+'">'+label+'</button>';
  const checks=MATS.map(m=>'<label><input type="checkbox" id="nf-t-'+m.key+'" data-t="'+m.key+'"'+(draft.nlThemes[m.key]?' checked':'')+'>'+esc(tr(m))+'</label>').join("");
  return head(esc(tr(N.titre)||L.news))
   +'<div class="prose"><p>'+txt(tr(N.intro))+'</p></div>'
   +'<div class="filters" style="max-width:80ch"><div class="fchips">'+mode("s",L.nlSub)+mode("u",L.nlUnsub)+'</div></div>'
   +'<form class="form" id="nf" data-un="'+(un?1:0)+'" novalidate>'
   +(un?'':'<fieldset><legend>'+L.nlThemes+'</legend><div class="checks">'+checks+'</div><div class="row2" style="display:flex;gap:8px;margin-top:6px"><button class="btn" type="button" id="nf-all">'+L.nlAllT+'</button><button class="btn" type="button" id="nf-none">'+L.nlNone+'</button></div></fieldset>'
     +'<label for="nf-lang">'+L.nlLang+'<select id="nf-lang">'+["FR","NL","EN"].map(c=>'<option'+(draft.nlLang===c?' selected':'')+'>'+c+'</option>').join("")+'</select></label>')
   +'<label for="nf-email">'+L.nlEmail+'<small>'+L.nlEmailH+'</small><input id="nf-email" type="email" autocomplete="email" value="'+esc(draft.nlEmail||"")+'"></label>'
   +'</form>'
   +'<div class="out"><h3>'+L.outH+'</h3><pre id="nf-out" tabindex="0"></pre>'
   +'<div class="row2"><button class="btn main" id="nf-copy" type="button">'+L.copy+'</button><a class="btn" id="nf-mail" href="mailto:'+esc(A)+'">'+L.mail+'</a></div>'
   +'<div class="row2"><span>'+L.outTo+'</span> <span class="addr" id="nf-addr">'+esc(A)+'</span> <button class="btn" id="nf-copyaddr" type="button">'+L.copyAddr+'</button></div>'
   +'<div class="status" id="nf-status" role="status"></div><p class="fine" style="margin:0">'+L.mailH+'</p></div>'
   +'<p class="fine" style="margin-top:16px">'+txt(tr(N.suite))+'</p><p class="fine">'+txt(tr(N.vieprivee))+'</p>';
}
function newsMessage(un){
  const L=t(), keys=MATS.filter(m=>draft.nlThemes&&draft.nlThemes[m.key]);
  // Objets fixes, en francais quelle que soit la langue : ils servent au tri automatique des demandes.
  if(un) return {subject:"[CityScan newsletter] Désabonnement", body:L.nlBye+"\n\n"+L.nlAddr+" : "+(draft.nlEmail||"").trim()+"\n", ok:true};
  return {subject:"[CityScan newsletter] Abonnement", ok:keys.length>0,
    body:L.nlConsent+"\n\n"+L.nlThemes+" : "+keys.map(m=>tr(m)).join(", ")+"\n"+L.nlCodes+" : "+keys.map(m=>m.key).join(", ")+"\n"+L.nlLang+" : "+draft.nlLang+"\n"+L.nlAddr+" : "+(draft.nlEmail||"").trim()+"\n"};
}
function wireNews(m){
  const L=t(), form=m.querySelector("#nf"), un=form.dataset.un==="1", out=m.querySelector("#nf-out"), mail=m.querySelector("#nf-mail"), status=m.querySelector("#nf-status"), addr=m.querySelector("#nf-addr").textContent;
  let cur={ok:true};
  const refresh=()=>{cur=newsMessage(un);out.textContent=L.nlSubj+" : "+cur.subject+"\n\n"+cur.body;mail.href="mailto:"+addr+"?subject="+encodeURIComponent(cur.subject)+"&body="+encodeURIComponent(cur.body);};
  form.addEventListener("submit",e=>e.preventDefault());
  form.querySelectorAll("[data-t]").forEach(el=>el.addEventListener("change",()=>{draft.nlThemes[el.dataset.t]=el.checked;status.textContent="";refresh();}));
  const all=v=>{form.querySelectorAll("[data-t]").forEach(el=>{el.checked=v;draft.nlThemes[el.dataset.t]=v;});status.textContent="";refresh();};
  const ba=m.querySelector("#nf-all"), bn=m.querySelector("#nf-none"), sl=m.querySelector("#nf-lang"), em=m.querySelector("#nf-email");
  if(ba) ba.addEventListener("click",()=>all(true)); if(bn) bn.addEventListener("click",()=>all(false));
  if(sl) sl.addEventListener("change",()=>{draft.nlLang=sl.value;refresh();});
  em.addEventListener("input",()=>{draft.nlEmail=em.value;refresh();});
  const selectText=el=>{const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);};
  const copy=(text,el,okMsg)=>{const fail=()=>{selectText(el);status.textContent=L.copyFail;};
    try{navigator.clipboard.writeText(text).then(()=>{status.textContent=okMsg;},fail);}catch(e){fail();}};
  m.querySelector("#nf-copy").addEventListener("click",()=>{if(!cur.ok){status.textContent=L.nlNeed;return;}copy(out.textContent,out,L.copied+addr+".");});
  mail.addEventListener("click",e=>{if(!cur.ok){e.preventDefault();status.textContent=L.nlNeed;}});
  m.querySelector("#nf-copyaddr").addEventListener("click",()=>copy(addr,m.querySelector("#nf-addr"),L.copiedAddr));
  refresh();
}
const weekOf=f=>f.edition||"lib";
function exList(week,o){return F.filter(f=>(!week||weekOf(f)===week)&&(!o.mat||f.matiere.key===o.mat)&&(!o.verdict||f.verdict===o.verdict)&&(!o.inst||f.inst.indexOf(o.inst)>=0));}
function shortWeek(e){return tr(e.periode).replace(/^(Semaine du|Week van|Week of)\s+/i,"");}
function viewExplorer(){
  const L=t(), weeks=D.editions.map(e=>e.id), week=(route.key&&(route.key==="lib"||weeks.indexOf(route.key)>=0))?route.key:null;
  const chip=(k,v,label,n,on)=>'<button data-exk="'+k+'" data-exv="'+esc(v||"")+'" aria-pressed="'+on+'">'+esc(label)+'<span class="k">'+n+'</span></button>';
  const wchip=(v,label)=>'<button data-v="explorer" data-k="'+(v||"")+'" aria-pressed="'+(week===v)+'">'+esc(label)+'<span class="k">'+exList(v,ex).length+'</span></button>';
  const mats=MATS.filter(m=>ex.mat===m.key||exList(week,{mat:m.key,verdict:ex.verdict,inst:ex.inst}).length);
  const r=exList(week,ex);
  const any=week||ex.mat||ex.verdict||ex.inst;
  return head(L.exTitle,r.length+" "+L.fFiches)
   +'<p style="max-width:74ch;color:var(--muted);margin:-4px 0 12px">'+L.exIntro+'</p>'
   +'<div class="filters">'
   +'<div class="frow"><span>'+L.exWeek+'</span><div class="fchips">'+wchip(null,L.exAll)+D.editions.map(e=>wchip(e.id,shortWeek(e))).join("")+wchip("lib",L.exLib)+'</div></div>'
   +'<div class="frow"><span>'+L.exMat+'</span><div class="fchips">'+chip("mat",null,L.exAllM,exList(week,{mat:null,verdict:ex.verdict,inst:ex.inst}).length,!ex.mat)+mats.map(m=>chip("mat",m.key,tr(m),exList(week,{mat:m.key,verdict:ex.verdict,inst:ex.inst}).length,ex.mat===m.key)).join("")+'</div></div>'
   +'<div class="frow"><span>'+L.exVerdict+'</span><div class="fchips">'+chip("verdict",null,L.exAllM,exList(week,{mat:ex.mat,verdict:null,inst:ex.inst}).length,!ex.verdict)+["best","bad","watch"].map(v=>chip("verdict",v,L[v],exList(week,{mat:ex.mat,verdict:v,inst:ex.inst}).length,ex.verdict===v)).join("")+'</div></div>'
   +'<div class="frow"><span>'+L.exInst+'</span><div class="fchips">'+chip("inst",null,L.exAll,exList(week,{mat:ex.mat,verdict:ex.verdict,inst:null}).length,!ex.inst)+["Région","COCOM","COCOF"].map(v=>chip("inst",v,L.instName[v],exList(week,{mat:ex.mat,verdict:ex.verdict,inst:v}).length,ex.inst===v)).join("")+'</div></div>'
   +(any?'<div><button class="btn" data-exk="reset">'+L.exReset+'</button></div>':'')
   +'</div>'
   +(r.length?(ex.mat?grouped(r,f=>tr(f.theme),k=>k):grouped(r,f=>f.matiere.key,k=>tr(MATS.find(m=>m.key===k)))):'<div class="empty" style="margin-top:16px">'+L.none+'</div>');
}
function contribState(){
  const k=route.view==="reco"?"p":(route.key||"p"), ty=("pck".indexOf(k.charAt(0))>=0?k.charAt(0):"p"), id=k.indexOf(":")>0?k.slice(k.indexOf(":")+1):null;
  const f=id?F.find(x=>x.id===id):null;
  return {ty:ty,f:f};
}
function viewContrib(){
  const L=t(), C=PG().contribuer||{}, st=contribState(), ML=(window.LABMR&&window.LABMR.contact)||"olivier.willocx@mrbruxelles.be";
  if(st.f) draft.fiche=st.f.id+" — "+vk(st.f.villeKey)+" — "+tr(st.f.titre);
  const v=k=>esc(draft[k]||"");
  const inp=(k,label,hint,opt)=>'<label for="cf-'+k+'">'+label+(opt?' <small>('+L.fOpt+')</small>':'')+(hint?'<small>'+hint+'</small>':'')+'<input id="cf-'+k+'" data-f="'+k+'" type="text" value="'+v(k)+'"></label>';
  const ta=(k,label,hint)=>'<label for="cf-'+k+'">'+label+(hint?'<small>'+hint+'</small>':'')+'<textarea id="cf-'+k+'" data-f="'+k+'">'+v(k)+'</textarea></label>';
  const sel=(k,label,opts)=>'<label for="cf-'+k+'">'+label+'<select id="cf-'+k+'" data-f="'+k+'"><option value=""></option>'+opts.map(o=>'<option'+(draft[k]===o?' selected':'')+'>'+esc(o)+'</option>').join("")+'</select></label>';
  const tyBtn=(c,label)=>'<button data-v="contribuer" data-k="'+c+(st.f&&c!=="p"?":"+esc(st.f.id):"")+'" aria-pressed="'+(st.ty===c)+'">'+label+'</button>';
  let fields="";
  if(st.ty==="p") fields=inp("ville",L.fVilleP)+inp("date",L.fDateP)+ta("quoi",L.fQuoiP,L.fQuoiH)+inp("source",L.fSrcU,L.fSrcH)+ta("resultats",L.fResP)+inp("nom",L.fNom,null,true)+sel("cite",L.fCite,[L.yes,L.no]);
  else if(st.ty==="c") fields=inp("fiche",L.fFiche,L.fFicheH)+sel("point",L.fPoint,L.pts)+ta("argument",L.fArg,L.fArgH)+inp("source",L.fSrcU,L.fSrcH)+inp("nom",L.fNom,null,true)+sel("cite",L.fCite,[L.yes,L.no]);
  else fields=inp("fiche",L.fFiche,L.fFicheH)+ta("correction",L.fCorr)+inp("source",L.fSrcU,L.fSrcH)+inp("nom",L.fNom,null,true)+sel("cite",L.fCite,[L.yes,L.no]);
  return head(esc(tr(C.titre)||L.contribute))
   +'<div class="filters" style="max-width:80ch"><div class="fchips">'+tyBtn("p",L.tyP)+tyBtn("c",L.tyC)+tyBtn("k",L.tyK)+'</div></div>'
   +'<div class="prose" style="margin-top:16px"><p>'+txt(tr((C.intro||{})[st.ty]))+'</p></div>'
   +'<form class="form" id="cf" data-ty="'+st.ty+'" novalidate>'+fields+'</form>'
   +'<div class="out"><h3>'+L.outH+'</h3><pre id="cf-out" tabindex="0"></pre>'
   +'<div class="row2"><button class="btn main" id="cf-copy" type="button">'+L.copy+'</button><a class="btn" id="cf-mail" href="mailto:'+esc(ML)+'">'+L.mail+'</a></div>'
   +'<div class="row2"><span>'+L.outTo+'</span> <span class="addr" id="cf-addr">'+esc(ML)+'</span> <button class="btn" id="cf-copyaddr" type="button">'+L.copyAddr+'</button></div>'
   +'<div class="status" id="cf-status" role="status"></div><p class="fine" style="margin:0">'+L.mailH+'</p></div>'
   +'<p class="fine" style="margin-top:16px">'+txt(tr(C.suite))+'</p><p class="fine">'+txt(tr(C.vieprivee))+'</p>';
}
function contribMessage(ty){
  const L=t(), lab={ville:L.fVilleP,date:L.fDateP,quoi:L.fQuoiP,source:L.fSrcU,resultats:L.fResP,nom:L.fNom,cite:L.fCite,fiche:L.fFiche,point:L.fPoint,argument:L.fArg,correction:L.fCorr};
  const order={p:["ville","date","quoi","source","resultats","nom","cite"],c:["fiche","point","argument","source","nom","cite"],k:["fiche","correction","source","nom","cite"]}[ty];
  const subject={p:L.sbP,c:L.sbC,k:L.sbK}[ty];
  const body=L.type+" : "+{p:L.tyP,c:L.tyC,k:L.tyK}[ty]+"\n\n"+order.map(k=>lab[k]+(/\?$/.test(lab[k])?"":" :")+"\n"+(draft[k]||"").trim()).join("\n\n")+"\n\n"+L.lang+" : "+lang.toUpperCase()+"\n";
  return {subject:subject,body:body};
}
function wireContrib(m){
  const L=t(), form=m.querySelector("#cf"), ty=form.dataset.ty, out=m.querySelector("#cf-out"), mail=m.querySelector("#cf-mail"), status=m.querySelector("#cf-status"), addr=m.querySelector("#cf-addr").textContent;
  const refresh=()=>{const x=contribMessage(ty);out.textContent=x.subject+"\n\n"+x.body;mail.href="mailto:"+addr+"?subject="+encodeURIComponent(x.subject)+"&body="+encodeURIComponent(x.body);};
  form.addEventListener("submit",e=>e.preventDefault());
  form.querySelectorAll("[data-f]").forEach(el=>{const h=()=>{draft[el.dataset.f]=el.value;status.textContent="";refresh();};el.addEventListener("input",h);el.addEventListener("change",h);});
  const selectText=el=>{const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);};
  const copy=(text,el,okMsg)=>{const fail=()=>{selectText(el);status.textContent=L.copyFail;};
    try{navigator.clipboard.writeText(text).then(()=>{status.textContent=okMsg;},fail);}catch(e){fail();}};
  m.querySelector("#cf-copy").addEventListener("click",()=>copy(out.textContent,out,L.copied+addr+"."));
  m.querySelector("#cf-copyaddr").addEventListener("click",()=>copy(addr,m.querySelector("#cf-addr"),L.copiedAddr));
  refresh();
}

  const L=t();document.documentElement.lang=lang;
  document.getElementById("who").textContent=L.who;document.getElementById("who").href="#/"+lang+"/auteur";
  document.getElementById("q").placeholder=L.search;

   +'<p class="fine">'+(lang==="nl"?"Verantwoordelijke uitgever: Olivier Willocx, Huart Hamoirlaan 71, 1030 Brussel":lang==="en"?"Responsible publisher: Olivier Willocx, Avenue Huart Hamoir 71, 1030 Brussels":"Éditeur responsable : Olivier Willocx, Avenue Huart Hamoir 71, 1030 Bruxelles")+'</p>'
   +(V?'<p class="fine">'+L.ver+' '+esc(V.num)+' — '+esc(tr(V.date))+'</p>':'')
   +'<p class="footnav"><button data-v="pourquoi">'+L.why+'</button><button data-v="ia">'+L.aiTag+'</button><button data-v="contribuer">'+L.contribute+'</button><button data-v="newsletter">'+L.news+'</button><button data-v="mentions">'+L.legalShort+'</button></p>';
  foot.querySelectorAll("[data-v]").forEach(function(b){b.addEventListener("click",function(){go(b.dataset.v)})});
  renderSide();renderMain();window.scrollTo({top:0});
}
document.getElementById("lfr").addEventListener("click",()=>setLang("fr"));
document.getElementById("lnl").addEventListener("click",()=>setLang("nl"));
document.getElementById("len").addEventListener("click",()=>setLang("en"));
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim();renderMain()});
document.querySelectorAll(".aibar [data-v]").forEach(function(b){b.addEventListener("click",function(){q="";document.getElementById("q").value="";go(b.dataset.v,b.dataset.k||null)})});

parseHash();render();
})();
