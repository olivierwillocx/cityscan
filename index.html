*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}

.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}

.mark{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.mark .wm{font-style:normal}.mark b{color:var(--accent);font-weight:inherit}
.mark svg{width:28px;height:28px;flex:none}
.who{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{padding:5px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--bg);min-width:190px;flex:0 1 300px}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;width:100%;outline:none}
.search input::placeholder{color:var(--muted)}

.wrap{max-width:1240px;margin:0 auto;padding-block:24px 64px;padding-inline:20px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:34px}

.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 96px);overflow-y:auto;padding-right:4px}

.menu h4{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}

.thesis{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}

.thesis p{max-width:70ch;margin:14px 0 0;color:var(--muted);font-size:17px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:14px}
.legend span{display:inline-flex;align-items:center}

.figs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:16px}

.fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 12px}

.lead{background:var(--surface2);border-left:3px solid var(--accent);padding:14px 18px;border-radius:0 10px 10px 0;max-width:80ch}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:9px}

.tile .h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tile .h b{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.2}

.vbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface2)}
.vbar i{display:block}
.vbar i.best{background:var(--best)}.vbar i.bad{background:var(--bad)}.vbar i.watch{background:var(--watch)}
.tile .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.yearnav{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 16px}

.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card.best{border-left:4px solid var(--best)}.card.bad{border-left:4px solid var(--bad)}.card.watch{border-left:4px solid var(--watch)}

.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;grid-column:1/-1}

.card .t{font-family:var(--display);font-weight:600;font-size:18.5px;line-height:1.28;text-wrap:balance}
.card .c{color:var(--muted);font-size:14px}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}

.row{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;text-align:left;width:100%}
.row:hover{border-color:var(--accent)}

.row .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.foot{max-width:1240px;margin:0 auto;padding:18px 20px 44px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}

  methodIntro:"Elke week zeven vier onderzoeksteams de nationale kwaliteitspers, de gespecialiseerde stedenpers en de Belgische pers door de Brusselse bevoegdheden, in zes talen. Een initiatief wordt enkel weerhouden als het concreet is — beslissing genomen, budget gestemd, maatregel gelanceerd, resultaat gepubliceerd — en als minstens één gedateerde, geopende en gelezen persbron het bevestigt. Aankondigingseffecten en proefprojecten zonder kalender vallen af. Wanneer een cijfer van de stad zelf komt of betwist wordt, zegt de fiche dat. Wanneer niets solide gevonden werd in een materie, wordt de fiche niet geschreven: de leemte wordt gemeld, niet opgevuld.",
  methodVerdict:"Het oordeel — goede praktijk, slechte praktijk, te evalueren — slaat op de vastgestelde resultaten, niet op de politieke kleur van de meerderheid die de maatregel nam. Een goed idee van een linkse meerderheid staat er als goede praktijk; een liberale maatregel waarvan de evaluatie tegenvalt, staat er als slechte praktijk.",
  libraryNote:"De bibliotheek werd opgebouwd met een retrospectieve inhaalslag over twaalf maanden en groeit sindsdien elke maandag aan met een nieuwe editie.",
  foot1:"CityScan — Europees persoverzicht van stedelijke initiatieven binnen de bevoegdheden van het Brussels Hoofdstedelijk Gewest, de GGC en de COCOF.",
  foot2:"Elke fiche verwijst naar minstens één gedateerde persbron. Wekelijks bijgewerkt, op maandag."
 }
};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let lang="fr", route={view:"home",key:null}, q="";
const t=()=>T[lang];
const MATS=(function(){const m=new Map();F.forEach(f=>{if(!m.has(f.matiere.key))m.set(f.matiere.key,f.matiere)});return [...m.values()].sort((a,b)=>cnt(b.key)-cnt(a.key))})();
function cnt(k){return F.filter(f=>f.matiere.key===k).length}
function vcount(list){return {best:list.filter(f=>f.verdict==="best").length,bad:list.filter(f=>f.verdict==="bad").length,watch:list.filter(f=>f.verdict==="watch").length}}

function parseHash(){
  const h=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  if(h[0]==="nl"||h[0]==="fr")lang=h.shift();
  route={view:h[0]||"home",key:h[1]?decodeURIComponent(h[1]):null};
}
function go(view,key){location.hash="#/"+lang+"/"+(view||"home")+(key?"/"+encodeURIComponent(key):"");}
function setLang(l){lang=l;go(route.view,route.key);}
function matches(f){
  if(!q)return true;const s=q.toLowerCase();
  return [f.titre[lang],f.ville[lang],f.theme[lang],f.quoi[lang],f.matiere[lang],f.villeKey,f.inst,f.competence[lang],f.transposabilite[lang]].join(" ").toLowerCase().includes(s);
}
function bars(tr){const n={forte:3,moyenne:2,faible:1}[tr]||0;return '<span class="bars">'+[1,2,3].map(i=>'<i class="'+(i<=n?"on":"")+'"></i>').join("")+'</span>';}
function vbar(list){const c=vcount(list),n=list.length||1;return '<span class="vbar"><i class="best" style="width:'+(c.best/n*100)+'%"></i><i class="bad" style="width:'+(c.bad/n*100)+'%"></i><i class="watch" style="width:'+(c.watch/n*100)+'%"></i></span>';}
function fmtMonth(iso){const L=t(),[y,m]=iso.split("-");return L.months[+m-1]+" "+y;}

function nbMois(){
  const d=F.map(f=>f.dateISO).sort(), a=d[0].split("-"), b=d[d.length-1].split("-");
  return (b[0]-a[0])*12+(b[1]-a[1])+1;
}
function annees(){return [...new Set(F.map(f=>f.dateISO.slice(0,4)))].sort().reverse()}
function card(f){
  const L=t();
  return '<details class="card '+f.verdict+'" id="'+f.id+'">'
  +'<summary><div class="chips">'
  +'<span class="chip v '+f.verdict+'">'+L.verdictName[f.verdict]+'</span>'
  +'<span class="chip inst">'+esc(L.instName[f.inst]||f.inst)+'</span>'
  +'<span class="chip">'+esc(f.theme[lang])+'</span>'
  +'<span class="chip">'+esc(f.villeKey)+' · '+esc(f.pays)+'</span>'
  +'<span class="chip">'+esc(fmtMonth(f.dateISO))+'</span></div>'
  +'<div><div class="t">'+esc(f.titre[lang])+'</div><div class="c">'+esc(f.date[lang])+'</div></div>'
  +'<div class="tr">'+L.transpoL+' · '+L.transpo[f.transpo]+bars(f.transpo)+'</div>'
  +'<span class="open">'+L.open+'</span></summary>'
  +'<dl class="body">'
  +'<dt>'+L.fVille+'</dt><dd>'+esc(f.ville[lang])+'</dd>'
  +'<dt>'+L.fComp+'</dt><dd>'+esc(f.competence[lang])+'</dd>'
  +'<dt>'+L.fQuoi+'</dt><dd>'+esc(f.quoi[lang])+'</dd>'
  +'<dt>'+L.fRes+'</dt><dd>'+esc(f.resultats[lang])+'</dd>'
  +'<dt>'+L.fTrans+'</dt><dd>'+esc(f.transposabilite[lang])+'</dd>'
  +'<dt>'+L.fAngle+'</dt><dd class="angle">'+esc(f.angle[lang])+'</dd>'
  +'<dt>'+L.fSrc+'</dt><dd class="src"><ul>'+f.sources.map(s=>'<li>'+esc(s.media)+', '+esc(s.date)+' — <a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.url.replace(/^https?:\/\/(www\.)?/,"").slice(0,64))+(s.url.length>72?"…":"")+'</a></li>').join("")+'</ul></dd>'
  +'</dl></details>';
}
function grouped(list,keyFn,labelFn){
  const g=new Map();list.forEach(f=>{const k=keyFn(f);if(!g.has(k))g.set(k,[]);g.get(k).push(f)});
  return [...g.entries()].map(([k,fs])=>'<section class="group"><h3><span>'+esc(labelFn(k))+'</span><span>'+fs.length+'</span></h3><div class="cards">'+fs.map(card).join("")+'</div></section>').join("");
}
function head(title,meta){return '<div class="sec"><h2>'+title+'</h2>'+(meta?'<span class="meta">'+esc(meta)+'</span>':"")+'</div>';}

function renderSide(){
  const L=t();
  const item=(v,k,label,n,dot)=>'<li><button data-v="'+v+'" data-k="'+(k||"")+'" aria-current="'+(route.view===v&&(route.key||null)===(k||null))+'">'+(dot?'<span><span class="dot '+dot+'"></span>'+esc(label)+'</span>':'<span>'+esc(label)+'</span>')+(n!=null?'<span class="n">'+n+'</span>':"")+'</button></li>';
  const cities=[...new Set(F.map(f=>f.villeKey))].map(c=>[c,F.filter(f=>f.villeKey===c).length]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));

   +item("verdict","watch",L.watch,F.filter(f=>f.verdict==="watch").length,"watch")+'</ul></nav>'
   +'<nav class="menu"><h4>'+L.mMat+'</h4><ul>'+MATS.map(m=>item("matiere",m.key,m[lang],cnt(m.key))).join("")+'</ul></nav>'
   +'<nav class="menu"><h4>'+L.mInst+'</h4><ul>'+["Région","COCOM","COCOF"].map(i=>item("inst",i,L.instName[i],F.filter(f=>f.inst.indexOf(i)>=0).length)).join("")+'</ul></nav>'
   +'<nav class="menu"><h4>'+L.mCity+'</h4><ul>'+cities.slice(0,12).map(([c,n])=>item("city",c,c,n)).join("")+item("cities",null,L.cities,cities.length)+'</ul></nav>';
  document.querySelectorAll("#side button").forEach(b=>b.addEventListener("click",()=>{q="";document.getElementById("q").value="";go(b.dataset.v,b.dataset.k||null)}));
}

  } else if(route.view==="matiere"){

         "Économiste de formation (ULB), titulaire d'un master en droit européen de l'Université d'Amsterdam, il a été conseiller au cabinet d'un ministre bruxellois et attaché économique de la Région auprès de l'Union européenne. Il a enseigné pendant près de vingt ans et a été, durant 21 ans, vice-président de la plus grande école de promotion sociale de Bruxelles.",

         "CityScan bouwt daarop voort: kijken wat andere Europese steden echt gedaan hebben, meten wat werkte en wat mislukte, en daaruit concrete voorstellen voor Brussel halen."],
      k:"Loopbaan",
      tl:[["2024 –","Brussels volksvertegenwoordiger (MR)"],["2000 – 2024","Directeur-generaal en daarna gedelegeerd bestuurder van BECI"],["2012 – 2015","Voorzitter van de Brusselse Economische en Sociale Raad"],["2014 – 2021","Raadsheer in sociale zaken, Arbeidshof Brussel"],["1995 – 1997","Adviseur op het kabinet van een Brussels minister"]],

function render(){
  const L=t();document.documentElement.lang=lang;
  document.getElementById("who").textContent=L.who;document.getElementById("who").href="#/"+lang+"/auteur";

  renderSide();renderMain();window.scrollTo({top:0});
}
document.getElementById("lfr").addEventListener("click",()=>setLang("fr"));
document.getElementById("lnl").addEventListener("click",()=>setLang("nl"));
